name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build VST3
      run: cmake --build build --config Release --target JVH410OneKnob_VST3

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JVH-410-OneKnob-Windows-VST3
        path: build/JVH410OneKnob_artefacts/Release/VST3/
